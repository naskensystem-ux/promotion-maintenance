<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<!-- Cuba sambung semula automatik setiap 90s: bila DNS dipusing balik ke Railway,
     peserta terus dapat laman sebenar tanpa perlu refresh manual. -->
<meta http-equiv="refresh" content="90" />
<title>Cabutan Bertuah KRW &times; Nasken</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(160deg, #f3e7d8 0%, #e8d3ba 55%, #d8bd9a 100%);
    color: #3a2a1c;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 18px calc(24px + env(safe-area-inset-bottom));
  }
  .card {
    background: #fffaf3;
    border-radius: 22px;
    box-shadow: 0 18px 50px -12px rgba(80, 52, 28, 0.35);
    max-width: 420px;
    width: 100%;
    padding: 40px 28px 32px;
    text-align: center;
  }
  .cup { font-size: 54px; line-height: 1; }
  .brand {
    margin-top: 10px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #a9794a;
  }
  h1 {
    margin-top: 18px;
    font-size: 23px;
    font-weight: 800;
    line-height: 1.3;
    color: #2e2013;
  }
  p {
    margin-top: 14px;
    font-size: 15.5px;
    line-height: 1.6;
    color: #6b5742;
  }
  .dots {
    margin: 26px auto 4px;
    display: flex;
    gap: 9px;
    justify-content: center;
  }
  .dots span {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: #c98a3f;
    animation: pulse 1.3s ease-in-out infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.18s; }
  .dots span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); }
    40%           { opacity: 1;    transform: scale(1); }
  }
  .btn {
    display: inline-block;
    margin-top: 26px;
    background: #2e2013;
    color: #fffaf3;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    padding: 14px 30px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }
  .btn:active { transform: scale(0.97); opacity: 0.9; }
  .note {
    margin-top: 18px;
    font-size: 12.5px;
    color: #9c8a73;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="cup">&#9749;</div>
    <div class="brand">KRW &times; Nasken</div>
    <h1>Kempen sedang diselenggara sekejap</h1>
    <p>
      Laman cabutan bertuah sedang diselenggara seketika.
      Submission anda akan dibuka semula tak lama lagi &mdash;
      terima kasih sebab sabar! &#128591;
    </p>
    <div class="dots"><span></span><span></span><span></span></div>
    <button class="btn" onclick="location.reload()">Cuba Semula</button>
    <p class="note">Halaman ini akan cuba sambung semula secara automatik.</p>
  </main>
</body>
</html>
