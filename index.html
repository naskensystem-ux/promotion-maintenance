<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<!-- Cuba sambung semula automatik setiap 90s: bila DNS dipusing balik ke Railway,
     peserta terus dapat laman sebenar tanpa perlu refresh manual. -->
<meta http-equiv="refresh" content="90" />
<title>Cabutan Bertuah KRW &times; Nasken</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    color: #0f172a;
    /* Gradient gelap slate -> biru -> merah, sama macam laman kempen asal */
    background:
      radial-gradient(circle at 20% 25%, rgba(59, 130, 246, 0.18) 0%, transparent 45%),
      radial-gradient(circle at 82% 78%, rgba(220, 38, 38, 0.18) 0%, transparent 45%),
      linear-gradient(to bottom, #020617 0%, #172554 52%, #450a0a 100%);
    background-attachment: fixed;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 18px calc(28px + env(safe-area-inset-bottom));
  }
  .card {
    background: rgba(255, 255, 255, 0.96);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    border-radius: 24px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.55);
    max-width: 420px;
    width: 100%;
    padding: 38px 30px 32px;
    text-align: center;
  }
  .icon-circle {
    width: 64px;
    height: 64px;
    margin: 0 auto;
    border-radius: 9999px;
    background: #f1f5f9;
    color: #475569;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .icon-circle svg { width: 34px; height: 34px; }
  .kicker {
    margin-top: 16px;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #1d4ed8;
  }
  h1 {
    margin-top: 8px;
    font-size: 24px;
    font-weight: 800;
    line-height: 1.3;
    color: #0f172a;
  }
  p.body {
    margin-top: 13px;
    font-size: 15px;
    line-height: 1.62;
    color: #475569;
  }
  .dots {
    margin: 24px auto 4px;
    display: flex;
    gap: 9px;
    justify-content: center;
  }
  .dots span {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #2563eb;
    animation: pulse 1.3s ease-in-out infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.18s; }
  .dots span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); }
    40%           { opacity: 1;    transform: scale(1); }
  }
  .btn {
    display: inline-block;
    margin-top: 24px;
    /* Butang gradient biru -> merah, sama macam laman kempen asal */
    background: linear-gradient(to right, #1d4ed8, #dc2626);
    color: #ffffff;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    text-decoration: none;
    padding: 13px 30px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    transition: opacity 0.12s ease, transform 0.12s ease;
  }
  .btn:hover { opacity: 0.9; }
  .btn:active { transform: scale(0.98); }
  .note {
    margin-top: 16px;
    font-size: 12px;
    color: #94a3b8;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="icon-circle">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
      </svg>
    </div>
    <div class="kicker">KRW &times; Nasken</div>
    <h1>Kempen sedang diselenggara</h1>
    <p class="body">
      Laman cabutan bertuah sedang diselenggara seketika.
      Submission anda akan dibuka semula tak lama lagi &mdash;
      terima kasih sebab sabar! &#128591;
    </p>
    <div class="dots"><span></span><span></span><span></span></div>
    <button class="btn" onclick="location.reload()">Cuba Semula</button>
    <p class="note">Halaman ini akan cuba sambung semula secara automatik.</p>
  </main>
</body>
</html>
